name: Build IG

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push cancels a pull request's build, but not a run on main: that run
# may be part way through loading the FHIR store or syncing the site, and
# stopping it there leaves a mix of two releases. Runs on main queue instead.
concurrency:
  group: ig-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Fast gate: runs on every push, catches most authoring mistakes in ~30s.
  sushi:
    name: SUSHI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      # pipefail so the step fails on SUSHI's own exit code rather than on
      # tee's. Matching the log text instead was the earlier approach and it is
      # the same defect the QA gate had: a summary line that says "1 Error" is
      # prose, and a gate that stops recognising the prose reports success.
      - name: Compile FSH
        run: |
          set -o pipefail
          npx sushi build . 2>&1 | tee sushi.log
      - uses: actions/upload-artifact@v4
        with:
          name: fsh-generated
          path: fsh-generated/

  # Slow gate: full IG build. ~8 minutes. Produces the reviewable site.
  publish:
    name: IG Publisher
    runs-on: ubuntu-latest
    needs: sushi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }

      # The IG Publisher shells out to Jekyll to render the narrative pages.
      # Without it the build fails after validation, at page generation.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false
      - run: gem install jekyll --no-document

      - run: npm ci

      # The FHIR package cache is the difference between an 8-minute build
      # and a 20-minute one.
      - name: Cache FHIR packages
        uses: actions/cache@v4
        with:
          path: ~/.fhir/packages
          key: fhir-pkgs-${{ hashFiles('sushi-config.yaml') }}
          restore-keys: fhir-pkgs-

      - name: Build IG
        run: npm run build

      - name: Gate on QA errors
        run: npm run qa

      # The maps are replayed against their example responses with the same
      # R5 engine the study's FHIR store runs, and the Bundles compared with
      # the ones checked in. A map that compiles is not a map that works.
      - name: Replay the maps
        run: tests/run-maps.sh

      # While the repo is private, this artifact IS the deliverable.
      # Reviewers download the zip; no Pages site needed.
      - uses: actions/upload-artifact@v4
        with:
          name: healthy-route-ig-site
          path: output/
          retention-days: 30

      # The package alone, for the job that loads the FHIR store. It carries
      # every profile with its snapshot and the maps the publisher compiled.
      - uses: actions/upload-artifact@v4
        with:
          name: guide-package
          path: output/package.tgz
          if-no-files-found: error
          retention-days: 7

  # Loads the guide's forms, maps, code systems, value sets and profiles into
  # the study service's FHIR store, one GitHub environment per store. Only a
  # build that passed the QA gate and the map replay gets here. Inert until the
  # repository variable LOAD_ENABLED is 'true', so pushes to main do not fail
  # before the environments exist. It has to be a repository variable: the if
  # below is read before the job has an environment, so an environment's own
  # variables are not visible to it. Each environment needs the secrets
  # HAPI_FHIR_BASE_URL, OIDC_TOKEN_URL, OIDC_CLIENT_ID and OIDC_CLIENT_SECRET.
  load-fhir-store:
    name: Load into the FHIR store (${{ matrix.environment }})
    runs-on: ubuntu-latest
    needs: publish
    if: github.ref == 'refs/heads/main' && vars.LOAD_ENABLED == 'true'
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Another store is one more name here, and a GitHub environment of the
        # same name holding its four secrets.
        environment: [testing]
    environment:
      name: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: guide-package
          path: package/
      - name: Load the guide's resources
        env:
          HAPI_FHIR_BASE_URL: ${{ secrets.HAPI_FHIR_BASE_URL }}
          OIDC_TOKEN_URL: ${{ secrets.OIDC_TOKEN_URL }}
          OIDC_CLIENT_ID: ${{ secrets.OIDC_CLIENT_ID }}
          OIDC_CLIENT_SECRET: ${{ secrets.OIDC_CLIENT_SECRET }}
        run: python3 -I scripts/load-package.py package/package.tgz

  # Publishes to fhir.savannahghi.org. Inert until the AWS secrets exist,
  # so it costs nothing while the repo is private.
  publish-site:
    name: Publish to fhir.savannahghi.org
    runs-on: ubuntu-latest
    needs: publish
    if: github.ref == 'refs/heads/main' && vars.PUBLISH_ENABLED == 'true'
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: healthy-route-ig-site
          path: site/
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PUBLISH_ROLE }}
          aws-region: af-south-1
      - name: Read IG version
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Sync current
        run: aws s3 sync site/ "s3://${{ secrets.S3_BUCKET }}/ig/healthy-route/" --delete
      - name: Sync pinned version
        run: aws s3 sync site/ "s3://${{ secrets.S3_BUCKET }}/ig/healthy-route/${{ steps.v.outputs.version }}/"
      - name: Invalidate CDN
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/ig/healthy-route/*"
